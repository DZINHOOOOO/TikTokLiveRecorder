
name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar aplicativo
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean TikTokLiveRecorder.spec

      - name: Gerar SHA256
        shell: pwsh
        run: |
          $file = "dist/TikTokLiveRecorder.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  TikTokLiveRecorder.exe" | Set-Content -Encoding ascii "$file.sha256"

      - name: Guardar executavel de teste
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TikTokLiveRecorder-Windows
          path: |
            dist/TikTokLiveRecorder.exe
            dist/TikTokLiveRecorder.exe.sha256

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/TikTokLiveRecorder.exe" `
            "dist/TikTokLiveRecorder.exe.sha256" `
            --title "TikTok Live Recorder ${{ github.ref_name }}" `
            --notes "Atualizacao automatica do TikTok Live Recorder."
